<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סל הקניות - פינתה גלידה</title>
    <script src="../JS/cart.js" type="module"></script>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="stylesheet" href="../CSS/cart.css">
</head>
<body>
    <main class="cart-page">
        <h1 class="cart-title">סל הקניות</h1>
        <section id="cart-items" class="cart-items" aria-live="polite"></section>
        <section class="cart-summary">
            <p class="cart-total">סה"כ משוער: <strong id="cart-total">₪0</strong></p>
            <p class="cart-note">המחיר הסופי יחושב בעת ביצוע ההזמנה.</p>
            <div class="cart-actions">
                <a href="menu.html" class="cart-btn cart-btn-secondary">חזרה לתפריט</a>
                <a href="order.html" id="checkout-btn" class="cart-btn cart-btn-primary">מעבר להזמנה</a>
            </div>
        </section>
    </main>
</body>
</html>
