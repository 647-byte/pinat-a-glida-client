<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>האזור האישי - פינתה גלידה</title>
    <script src="../JS/account.js" type="module"></script>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="stylesheet" href="../CSS/forms.css">
    <link rel="stylesheet" href="../CSS/account.css">
</head>
<body>
    <main class="account-page">
        <div class="account-head">
            <div>
                <h1 class="account-title">האזור האישי</h1>
                <p id="account-greeting" class="account-greeting"></p>
            </div>
            <button type="button" id="logout-btn" class="account-logout">התנתקות</button>
        </div>
        <div class="account-layout">
            <section class="form-card" aria-labelledby="profile-title">
                <h2 id="profile-title">הפרטים שלי</h2>
                <form id="profile-form" class="form">
                    <label class="form-field">שם מלא
                        <input type="text" name="name" required minlength="2" autocomplete="name">
                    </label>
                    <label class="form-field">אימייל
                        <input type="email" name="email" disabled>
                    </label>
                    <label class="form-field">טלפון
                        <input type="tel" name="phone" pattern="0\d{8,9}" title="מספר טלפון ישראלי, ספרות בלבד, למשל 0501234567" autocomplete="tel">
                    </label>
                    <button type="submit" class="form-submit">שמירת שינויים</button>
                    <p class="form-status" role="alert"></p>
                </form>
            </section>
            <section class="form-card" aria-labelledby="orders-title">
                <h2 id="orders-title">ההזמנות שלי</h2>
                <div id="orders-list" class="orders-list" aria-live="polite"></div>
            </section>
        </div>
    </main>
</body>
</html>
