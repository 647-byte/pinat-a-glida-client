<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - פינתה גלידה</title>
    <link rel="stylesheet" href="../CSS/admin-login.css">
    <script type="module" src="../js/admin-login.js"></script>
</head>

<body>
    <main class="login-card">
        <!-- לוגו עגול -->
        <div class="logo-circle">
            <img src="../assets/images/pinata-logo3.png" alt="פינתה גלידה">
        </div>

        <!-- כותרת ותת כותרת -->
        <h1 class="login-title">Welcome to - פינתה גלידה<br>גלידרייה, בית, אוכל</h1>
        <p class="login-subtitle">Sign in to continue</p>
        <form id="admin-login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af"
                        stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af"
                        stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="submit-btn">Sign in</button>
        </form>
    </main>
</body>

</html>
